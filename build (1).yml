name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Unpack project zip
        run: |
          if [ -f SteveBossMod.zip ]; then
            unzip -oq SteveBossMod.zip
            cp -r SteveBossMod/. .
          fi
          ls

      - name: Get Gradle wrapper from the Forge 1.7.10 MDK
        run: |
          if [ ! -f gradlew ]; then
            V=1.7.10-10.13.4.1614-1.7.10
            curl -fL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/$V/forge-$V-src.zip" \
              || curl -fL -o mdk.zip "https://files.minecraftforge.net/maven/net/minecraftforge/forge/$V/forge-$V-src.zip"
            unzip -oq mdk.zip -d mdk
            cp mdk/gradlew mdk/gradlew.bat .
            cp -r mdk/gradle .
          fi
          chmod +x gradlew

      - name: Build
        run: ./gradlew setupCIWorkspace build --no-daemon

      - name: Upload jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SteveBossFight-jar
          path: build/libs/SteveBossFight-1.0.0.jar

      - name: Publish jar as a Release (direct .jar download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/SteveBossFight-1.0.0.jar \
            --title "Build ${{ github.run_number }}" --notes "Steve Boss Fight mod"
